name: CI — unit tests

# PR to main always runs (required status check). Path filters only on push
# so docs-only commits on main do not re-run the gate.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    paths:
      - 'gulimall-*/**'
      - 'gulimall-common/**'
      - 'renren-fast/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd-eks.yml'

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run targeted unit tests
        run: |
          mvn -pl gulimall-common,gulimall-order,gulimall-ware -am test \
            -Dtest=ProtectedCacheTest,IdempotencyServiceTest,OrderWorkflowServiceImplTest,StripePaymentServiceImplTest,WareSkuStockDeductTest,WareSkuSearchIndexNotifyTest \
            -Dsurefire.failIfNoSpecifiedTests=false
