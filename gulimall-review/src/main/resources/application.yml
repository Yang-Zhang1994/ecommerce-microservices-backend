server:
  port: 15000
  forward-headers-strategy: framework

spring:
  application:
    name: gulimall-review
  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        enabled: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # gulimall-common puts Redis on the classpath; only check it if this service uses Redis.
    redis:
      enabled: false
